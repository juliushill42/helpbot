[package]
name = "titan-host"
version = "0.2.0"
edition = "2021"

[dependencies]
tokio = { version = "1.35", features = ["full", "process"] }
rusqlite = { version = "0.30", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
reqwest = { version = "0.11", features = ["json"] }
regex = "1.10"
sha2 = "0.10"
hex = "0.4"
tempfile = "3.9"
nix = { version = "0.27", features = ["fs", "process"] }
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
